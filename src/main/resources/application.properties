# SQL Server connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Optical-Shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345  # thay b?ng m?t kh?u th?t

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

